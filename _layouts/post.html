<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    <div class="container">
      {% include menu.html %}
      <div class="post">
        <article>
          <header>
            <h1>{{ page.title }}</h1>
            <p class="post-meta">
              <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
            </p>
          </header>
          <div class="content">{{ content }}</div>
        </article>
        {% include comments.html %}
      </div>
      {% include footer.html %}
    </div>
  </body>
</html>
