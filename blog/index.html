---
layout: blog
title: Blog
---

{% for post in paginator.posts %}
<article class="post">
  <header>
    <h1>
      <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
    </h1>
    <p class="post-meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%B %-d, %Y" }}</time>
    </p>
  </header>
  <div class="content">
    {{ post.content }}
  </div>
</article>
{% endfor %}

<!-- Pagination links -->
<div class="paginator">
  {% if paginator.previous_page %}
  <a href="{{ paginator.previous_page_path }}" class="previous">&larr; Newer posts</a>
  {% endif %}
  {% if paginator.next_page %}
  <a href="{{ paginator.next_page_path }}">Older posts &rarr;</a>
  {% endif %}
</div>
